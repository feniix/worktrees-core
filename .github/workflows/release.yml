name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run checks only, skip publish"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect package.json version bump
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BASE=""
          HEAD="${{ github.sha }}"
          REASON=""

          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE="${{ github.event.before }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BASE="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi

          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            REASON="No base commit available for version comparison (initial run or missing history)."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION="$(git show "$BASE:package.json" 2>/dev/null | jq -r '.version // empty' || echo "")"
          NEW_VERSION="$(jq -r '.version // empty' package.json)"

          if [[ -z "$OLD_VERSION" || -z "$NEW_VERSION" ]]; then
            REASON="Missing package version in HEAD or previous commit; cannot determine publish status."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$OLD_VERSION" != "$NEW_VERSION" ]]; then
            REASON="Version bump detected: $OLD_VERSION -> $NEW_VERSION"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          else
            REASON="No version change in package.json: $OLD_VERSION"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    outputs:
      should_publish: ${{ needs.detect.outputs.should_publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Ensure new version is not already published
        run: |
          set -euo pipefail

          NAME="$(jq -r '.name' package.json)"
          VERSION="$(jq -r '.version' package.json)"

          if npm view "${NAME}@${VERSION}" >/dev/null 2>&1; then
            echo "::error::${NAME}@${VERSION} is already published. Bump version before publishing."
            exit 1
          fi

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  checks_skipped:
    needs: detect
    if: needs.detect.outputs.should_publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: |
          echo "::notice::Checks skipped: ${{ needs.detect.outputs.reason }}"

  publish:
    needs: checks
    if: needs.checks.outputs.should_publish == 'true' && (github.event.inputs.dry_run != 'true')
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: |
          npm publish --access public --provenance

  github_release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(jq -r '.version // empty' package.json)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Missing package version in package.json."
            exit 1
          fi

          TAG="v${VERSION}"
          CURRENT_SHA="$(git rev-parse HEAD)"

          timeout 120 git fetch --force --tags origin

          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_SHA" != "$CURRENT_SHA" ]]; then
              echo "::error::Tag ${TAG} already exists at ${TAG_SHA}, expected ${CURRENT_SHA}."
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub release ${TAG} already exists."
            exit 0
          fi

          PREVIOUS_TAG="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -n 1 || true)"
          RELEASE_ARGS=(release create "$TAG" --target "$CURRENT_SHA" --title "$TAG" --generate-notes --latest)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            RELEASE_ARGS+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          gh "${RELEASE_ARGS[@]}"

  publish_skipped:
    needs: checks
    if: needs.checks.outputs.should_publish == 'true' && (github.event.inputs.dry_run == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: |
          echo "::notice::Publish skipped because dry_run=true"

